name: Atualizar notícias e publicar o site

on:
  schedule:
    - cron: "7 * * * *"      # roda toda hora, no minuto 7 (horário UTC)
  workflow_dispatch:          # botão "Run workflow" para rodar na mão
  push:
    branches: [main]          # quando você edita um arquivo, o site é republicado

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar notícias
        run: python coletor/coletar.py

      - name: Guardar o resultado no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualização automática"
            git push
          fi

      - name: Montar a pasta do site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='coletor' --exclude='materias' --exclude='*.md' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
